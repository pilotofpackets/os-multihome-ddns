[cron]
command:/usr/local/opnsense/scripts/multiwanddns/multiwanddns.py cron
parameters:
type:script_output
message:Multi-WAN DynDNS: periodic check

[check]
command:/usr/local/opnsense/scripts/multiwanddns/multiwanddns.py check
parameters:%s
type:script_output
message:Multi-WAN DynDNS: check %s
description:Multi-WAN DynDNS: alle Einträge jetzt prüfen

[force]
command:/usr/local/opnsense/scripts/multiwanddns/multiwanddns.py force
parameters:%s
type:script_output
message:Multi-WAN DynDNS: force update %s
description:Multi-WAN DynDNS: Update erzwingen

[failover]
command:/usr/local/opnsense/scripts/multiwanddns/multiwanddns.py failover
parameters:
type:script_output
message:Multi-WAN DynDNS: evaluate failover

[reset]
command:/usr/local/opnsense/scripts/multiwanddns/multiwanddns.py reset
parameters:%s
type:script_output
message:Multi-WAN DynDNS: reset failover %s

[applied]
command:/usr/local/opnsense/scripts/multiwanddns/multiwanddns.py applied
parameters:
type:script_output
message:Multi-WAN DynDNS: settings applied

[status]
command:/usr/local/opnsense/scripts/multiwanddns/multiwanddns.py status
parameters:
type:script_output
message:Multi-WAN DynDNS: status

[test]
command:/usr/local/opnsense/scripts/multiwanddns/multiwanddns.py test
parameters:%s
type:script_output
message:Multi-WAN DynDNS: test %s

[services]
command:/usr/local/opnsense/scripts/multiwanddns/multiwanddns.py services
parameters:
type:script_output
message:Multi-WAN DynDNS: list services
