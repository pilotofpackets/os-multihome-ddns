[cron]
command:/usr/local/opnsense/scripts/multihomeddns/multihomeddns.py cron
parameters:
type:script_output
message:Multihome DynDNS: periodic check

[check]
command:/usr/local/opnsense/scripts/multihomeddns/multihomeddns.py check
parameters:%s
type:script_output
message:Multihome DynDNS: check %s
description:Multihome DynDNS: alle Einträge jetzt prüfen

[force]
command:/usr/local/opnsense/scripts/multihomeddns/multihomeddns.py force
parameters:%s
type:script_output
message:Multihome DynDNS: force update %s
description:Multihome DynDNS: Update erzwingen

[failover]
command:/usr/local/opnsense/scripts/multihomeddns/multihomeddns.py failover
parameters:
type:script_output
message:Multihome DynDNS: evaluate failover

[reset]
command:/usr/local/opnsense/scripts/multihomeddns/multihomeddns.py reset
parameters:%s
type:script_output
message:Multihome DynDNS: reset failover %s

[applied]
command:/usr/local/opnsense/scripts/multihomeddns/multihomeddns.py applied
parameters:
type:script_output
message:Multihome DynDNS: settings applied

[status]
command:/usr/local/opnsense/scripts/multihomeddns/multihomeddns.py status
parameters:
type:script_output
message:Multihome DynDNS: status

[test]
command:/usr/local/opnsense/scripts/multihomeddns/multihomeddns.py test
parameters:%s
type:script_output
message:Multihome DynDNS: test %s

[services]
command:/usr/local/opnsense/scripts/multihomeddns/multihomeddns.py services
parameters:
type:script_output
message:Multihome DynDNS: list services
