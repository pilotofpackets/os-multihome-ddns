[cron]
command:/usr/local/opnsense/scripts/cfddns/cfddns.py cron
parameters:
type:script_output
message:Cloudflare DDNS: periodic check

[check]
command:/usr/local/opnsense/scripts/cfddns/cfddns.py check
parameters:
type:script_output
message:Cloudflare DDNS: check all entries
description:Cloudflare DDNS: alle Einträge prüfen

[force]
command:/usr/local/opnsense/scripts/cfddns/cfddns.py force
parameters:
type:script_output
message:Cloudflare DDNS: force sync with Cloudflare
description:Cloudflare DDNS: Abgleich mit Cloudflare erzwingen

[status]
command:/usr/local/opnsense/scripts/cfddns/cfddns.py status
parameters:
type:script_output
message:Cloudflare DDNS: status

[test]
command:/usr/local/opnsense/scripts/cfddns/cfddns.py test
parameters:%s
type:script_output
message:Cloudflare DDNS: test entry %s
