name: Tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          pip install requests dnspython pyflakes
          sudo apt-get update -qq && sudo apt-get install -y -qq php-cli > /dev/null
      - name: Lint
        run: python -m pyflakes multihome-ddns/src/opnsense/scripts/multihomeddns/multihomeddns.py multihome-ddns/src/opnsense/scripts/multihomeddns/lib/*.py multihome-ddns/src/opnsense/scripts/multihomeddns/lib/account/__init__.py multihome-ddns/src/opnsense/scripts/multihomeddns/lib/account/cloudflare.py
      - name: Fetch OPNsense core rule classes
        run: |
          git clone -q --depth 1 --filter=blob:none --sparse https://github.com/opnsense/core /tmp/opnsense-core
          git -C /tmp/opnsense-core sparse-checkout set src/opnsense/mvc/app/library/OPNsense/Firewall
      - name: Scenario tests
        run: OPNSENSE_CORE=/tmp/opnsense-core sh tests/run.sh
